# The build is this project's compliance gate, not just a bundler.
#
# lib/content.ts refuses to build a page marked `status: reviewed` that still
# carries a [VERIFY] flag, or one that claims a review without naming the
# reviewer and the dates. That rule is the reason the repo exists in this shape,
# and until now nothing ran it automatically. It runs here, on every pull
# request, before a reviewer can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The real site URL is not a secret, and pinning it keeps the canonical
      # tags and JSON-LD in a CI build identical to production.
      NEXT_PUBLIC_SITE_URL: https://www.bayittitle.com
      # Supabase credentials are deliberately absent. The site is built to
      # render without them, so CI proves that path stays working.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The rules these cover — the reviewed/VERIFY gate, the review
      # suppressions, the document allowlist, the IP fingerprint — are decisions
      # about what the firm publishes and stores, not implementation detail. A
      # refactor could weaken any of them and every build would still be green.
      - name: Test
        run: npm test

      # Drafts have no route in production, so a production build alone would
      # never render the content library — a broken draft page would reach a
      # reviewer unbuilt. This build generates every draft and is the one that
      # exercises the library template.
      - name: Build with drafts (preview parity)
        run: npm run build
        env:
          SHOW_DRAFTS: '1'

      # The build that decides what the public actually gets: drafts excluded,
      # and the reviewed/VERIFY gate enforced on everything that remains.
      - name: Build for production
        run: npm run build
