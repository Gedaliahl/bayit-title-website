# The build is this project's compliance gate, not just a bundler.
#
# lib/content.ts refuses to build a page marked `status: reviewed` that still
# carries a [VERIFY] flag, or one that claims a review without naming the
# reviewer and the dates. That rule is the reason the repo exists in this shape.
# It runs here, on every pull request, before a reviewer can merge.
#
# Vercel already builds previews, but it only reports pass or fail on the
# deployment — it does not run ESLint or tsc, and it does not block anything.
# This is the check that does.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The real site URL is not a secret, and pinning it keeps the canonical
      # tags and JSON-LD in a CI build identical to production.
      NEXT_PUBLIC_SITE_URL: https://bayittitle.com
      # Supabase credentials are deliberately absent. The site is built to
      # render without them, so CI proves that path stays working — it
      # exercises the canonical fallback in lib/locations.ts.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Each check runs even if an earlier one failed, so a single run reports
      # everything wrong rather than one thing at a time.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # The rules these cover — the reviewed/VERIFY gate, the review
      # suppressions, the document allowlist, the IP fingerprint — are decisions
      # about what the firm publishes and stores, not implementation detail. A
      # refactor could weaken any of them and every build would still be green.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Drafts have no route in production, so a production build alone would
      # never render the content library — a broken draft page would reach a
      # reviewer unbuilt. This build generates every draft and is the one that
      # exercises the library template.
      - name: Build with drafts (preview parity)
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          SHOW_DRAFTS: '1'

      # The build that decides what the public actually gets: drafts excluded,
      # and the reviewed/VERIFY gate enforced on everything that remains.
      - name: Build for production
        if: ${{ !cancelled() }}
        run: npm run build

  # The browser suite, against the production build: every route at fourteen
  # widths, axe on every route, and the flows. Chromium on a desktop and a
  # phone, WebKit on a phone, and a Firefox smoke run (playwright.config.ts).
  e2e:
    name: Browser tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SITE_URL: https://bayittitle.com
      # Served over http on localhost; see next.config.mjs.
      E2E_PLAIN_HTTP: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Build
        run: npm run build

      - name: Playwright
        run: npm run test:e2e
        env:
          E2E_PREBUILT: '1'

      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Both folders start with a dot, which upload-artifact skips unless told.
          include-hidden-files: true
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 14

  # Lighthouse on four templates, as a phone. Accessibility and SEO fail the
  # job; performance and best practices only warn, since a shared runner's
  # timings move from one run to the next.
  #
  # A build that is not the production deployment answers robots noindex
  # (indexingAllowed in lib/seo.ts), and the only way to switch that on is
  # VERCEL_ENV=production, which also demands every county from Supabase and
  # turns on Vercel Analytics. So lighthouserc.json skips the one audit that
  # reads robots, is-crawlable, and SEO is scored on everything else.
  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: https://bayittitle.com

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The runner's own Chrome.
      - name: Lighthouse CI
        run: npm run lhci

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
