# Whether search engines can get into the live site, checked from outside.
#
# On 22 September 2026 the real domain went out with `Disallow: /` and
# `noindex` on every page while CI was green, because no test runs against the
# host Vercel actually serves. This does. It runs after every production deploy
# and once a day, and a red run means crawlers are being turned away from the
# live site right now.
#
# A production deploy that passes this starts .github/workflows/indexnow.yml,
# which sends the pages that are new or re-dated to IndexNow.
name: Live SEO

on:
  deployment_status:
  schedule:
    # Daily at 12:30 UTC, 8:30 in the morning in Florida.
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-seo
  cancel-in-progress: false

jobs:
  check:
    name: Check the live site is indexable
    # Vercel posts a deployment status for every preview too; only a finished
    # production deploy changes what the live site serves.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The deployment reports ready a moment before the domain is moved onto it.
      - name: Let the domain settle
        if: github.event_name == 'deployment_status'
        run: sleep 45

      # No npm ci: the script imports nothing but next.config.mjs and Node itself.
      - name: Check
        run: npm run check:live

